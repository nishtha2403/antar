name: pages

# Publishes the site, rendered from the records rather than from committed HTML.
#
# The build depends on the gate, and the renderer throws on an unverified
# figure, so a deploy either carries fully verified figures or does not happen.
on:
  push:
    branches: [main]
  # The record repository can move without this one changing.
  repository_dispatch:
    types: [records-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:casts
      - run: npm test
      - name: Render the site from data/
        run: npm run build
      - name: Check what would actually be served
        run: node scripts/check-output.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
