name: gate

# The guarantees, on every push. Nothing publishes on failure.
on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: No unsafe casts past the brands
        run: npm run lint:casts
      - name: Guarantee tests
        run: npm test
      - name: Build the site from the records
        run: npm run build
      - name: Check what would actually be served
        run: node scripts/check-output.mjs
